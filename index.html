<html lang="en-GB">
<head>
	<meta charset="utf-8" />
	<title>ACW Calculator</title>
	<script type="module" src="./js/main.js"></script>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="./percent-icon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/asvvvad/mono-color@1.2/light.min.css" media="" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/asvvvad/mono-color@1.2/dark.min.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/asvvvad/mono-color@1.2/mono-color.min.css" />
	<style>
	body {
		height: 100dvh;
		display: flex;
		flex-direction: column;
		opacity: 0;
	}
	
	body.ready {
		opacity: 1;
		transition: opacity 0.4s ease-out;
	}
	
	main {
		width: 100%;
		margin-top: 1rem;
		margin-bottom: auto;
		overflow: auto;
		scrollbar-width: none;
	}
	
	main::-webkit-scrollbar {
		width: 0px;
		background: transparent;
	}
	
	footer {
		max-height: 6rem;
		flex: 1;
		align-content: center;
	}
	
	.flex-row {
		display: flex;
		align-items: center;
	}
	
	.between {
		justify-content: space-between;
	}
	
	.end {
		justify-content: end;
	}
	
	.grow > * {
		flex-grow: 1;
	}
	
	button[aria-selected=true] {
		pointer-events: none;
		cursor: default;
	}
	
	input {
		field-sizing: content;
		font-size: 16px;
	}
	
	input:disabled {
		-webkit-text-fill-color: var(--fg);
		opacity: 1;
	}
	
	label {
		text-wrap: wrap;
	}
	</style>
</head>
<body class="container">
	<header>
		<nav role="tablist" class="flex-row">
			<button role="tab" class="btn primary" aria-controls="Calculator" aria-selected="true" >Calculator</button>
			<button role="tab" class="btn" aria-controls="Settings">Settings</button>
		</nav>
	</header>
	<main>
		<article role="tabpanel" id="Calculator">
			<form>
				<fieldset>
					<legend><input class="day" id="mo" type="checkbox" /><label for="mo">Monday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset>
					<legend><input class="day" id="tu" type="checkbox" /><label for="tu">Tuesday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset>
					<legend><input class="day" id="we" type="checkbox" /><label for="we">Wednesday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset>
					<legend><input class="day" id="th" type="checkbox" /><label for="th">Thursday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset>
					<legend><input class="day" id="fr" type="checkbox" /><label for="fr">Friday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset class="weekend" hidden>
					<legend><input class="day" id="sa" type="checkbox" /><label for="sa">Saturday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<fieldset class="weekend" hidden>
					<legend><input class="day" id="su" type="checkbox" /><label for="su">Sunday</label></legend>
					<input class="actual-acw inline w-50 tacenter" type="number" min="0" max="100" step="1" placeholder="Actual ACW %" /><!--
				 --><input class="avail-acw inline w-50 tacenter" placeholder="Available ACW" disabled />
				</fieldset>
				<div class="flex-row grow">
					<fieldset>
						<legend>Average ACW</legend>
						<input id="average-acw" class="inline w-100 tacenter" placeholder="Average ACW" disabled />
					</fieldset>
					<fieldset>
						<legend>Remaining ACW</legend>
						<input id="remaining-acw" class="inline w-100 tacenter" placeholder="Remaining ACW" disabled />
					</fieldset>
				</div>
			</form>
			<div class="flex-row end">
				<p class="m0 nano" hidden>Resets in: <span id="countdown">X Days</span></p>
				<button id="reset-calc" class="btn bg-error white m" aria-label="Reset Calculator">Reset</button>
			</div>
		</article>
		<article role="tabpanel" id="Settings" hidden >
			<form>
				<fieldset>
					<legend>Workday</legend>
					<div>
						<label for="work-hours">Work hours:<input id="work-hours" type="number" min="1" max="24" value="8" step="1" /></label>
					</div>
					<div>
					</div>
						<label for="daily-aux">Daily AUX (minutes):<input id="daily-aux" type="number" min="1" max="1440" value="30" step="1" /></label>
					<div>
						<label for="acw-target">ACW target (weekly %):<input id="acw-target" type="number" min="0" max="100" value="25" step="1" /></label>
					</div>
				</fieldset>
				<fieldset>
					<legend>Miscellaneous</legend>
					<div>
						<input id="display-time" type="checkbox" /><label for="display-time">Display time instead of percentage</label>
					</div>
					<div>
						<input id="show-weekend" type="checkbox" /><label for="show-weekend">Show Saturday and Sunday</label>
					</div>
					<div>
						<input id="acw-wo-aux" type="checkbox" /><label for="acw-wo-aux">Calculate ACW from work hours w/o AUX</label>
					</div>
				</fieldset>
				<div class="flex-row end">
					<button id="reset-everything" class="btn bg-error white m" aria-label="Reset everything">Reset everything</button>
				</div>
			</form>
		</article>
	</main>
	<footer class="default tacenter nano">
		This website was made without ai. <a href="https://github.com/broccoli-is-healthy/acw-calc" target="_blank">GitHub</a>
	</footer>
</body>
</html>
